    <div class="fn-list">

        <div class="fn-row" onclick="selectFunction('INSERT_USER_PRFTV')">
            <button class="fn-circle fn-insert">＋</button>
            <div class="fn-label">
                <span class="fn-title">NEW USER</span>
                <span class="fn-desc">Yangi foydalanuvchi qo'shish</span>
            </div>
        </div>
        
        <div class="fn-row" onclick="selectFunction('INSERT_Load_MTTY')">
            <button class="fn-circle fn-insert">＋</button>
            <div class="fn-label">
                <span class="fn-title">NEW LOAD</span>
                <span class="fn-desc">Yangi yuk qo'shish</span>
            </div>
        </div>
        

        <div class="fn-row" onclick="selectFunction('UPDATE_USER_NAME_BY_PHONE')">

            </div>
        </div>

        <div class="fn-row" onclick="selectFunction('UPDATE_USER_ROLE_BY_PHONE')">

            </div>
        </div>

        <div class="fn-row" onclick="selectFunction('UPDATE_CASH_CLOSED')">
            <button class="fn-circle fn-update">↻</button>
            <div class="fn-label">
                <span class="fn-title">UPD CASH/CLOSED</span>
                <span class="fn-desc">Yukning naqd va yopilgan holatini yangilash</span>
            </div>
        </div>

    </div>

    <div class="fn-row" onclick="selectFunction('DRIVER_LOAD')">
        <button class="fn-circle fn-join">⨝</button>
        <div class="fn-label">
            <span class="fn-title">JOIN DRIVER</span>
            <span class="fn-desc">Yuk va haydovchi ma'lumotlarini birlashtirish</span>
    </div>
